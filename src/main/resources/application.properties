# Application name
spring.application.name=tp-foyer2

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/tpfoyerdb3?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update   # safer than create-drop, will create/update tables but not drop DB

# Server context path
server.servlet.context-path=/tpfoyer

# Optional: Prevent tests from failing if DB is missing (useful for Docker build)
spring.sql.init.mode=never
